<script>
(function () {
  var root = document.documentElement;
  var themeButton = document.getElementById('theme-toggle');
  var saved = localStorage.getItem('site-theme');
  function apply(mode) {
    var active = mode === 'light' || mode === 'dark' ? mode : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', active);
    if (themeButton) themeButton.setAttribute('data-mode', active);
  }
  apply(saved || 'dark');
  if (themeButton) themeButton.addEventListener('click', function () {
    var next = themeButton.getAttribute('data-mode') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('site-theme', next); apply(next);
  });
  var toggle = document.getElementById('menu-toggle');
  var drawer = document.getElementById('nav-drawer');
  var overlay = document.getElementById('nav-overlay');
  var close = document.getElementById('drawer-close');
  function openMenu() { drawer.classList.add('open'); overlay.classList.add('visible'); drawer.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; }
  function closeMenu() { drawer.classList.remove('open'); overlay.classList.remove('visible'); drawer.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
  if (toggle) toggle.addEventListener('click', openMenu);
  if (close) close.addEventListener('click', closeMenu);
  if (overlay) overlay.addEventListener('click', closeMenu);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
  var year = document.getElementById('current-year'); if (year) year.textContent = new Date().getFullYear();
}());
</script>
